name: Deploy to hitrost.com

on:
  push:
    branches: [master]
  workflow_dispatch:

# never run two deploys at once; a newer push waits for the running one
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist/ over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # hitrost blocks port 21 from foreign IPs; connections from
          # abroad (incl. GitHub runners) must use 6021
          port: 6021
          local-dir: dist/
          server-dir: domains/siviljstvo-mitra.si/public_html/
