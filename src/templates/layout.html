<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANGS}}<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
{{HEAD_EXTRA}}<meta name="theme-color" content="#0f3a57">
<link rel="icon" href="{{P}}favicon.ico">
<link rel="apple-touch-icon" href="{{P}}apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora&display=swap">
<link rel="stylesheet" href="{{P}}assets/css/site.css">
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<a class="skip" href="#main">{{SKIP_LABEL}}</a>

<header class="bar">
  <button class="bar-menu" id="nav-toggle" aria-label="{{MENU_ARIA}}" aria-expanded="false" aria-controls="side">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
  </button>
  <span class="bar-brand">Šiviljstvo Mitra</span>
</header>

<div class="scrim" id="scrim"></div>

<aside class="side" id="side">
  <div class="side-gradient">
    <img src="{{P}}assets/images/brand/siviljstvo-400.webp" alt="Šiviljstvo" width="200" height="94">
    <img src="{{P}}assets/images/brand/mitra-400.webp" alt="Mitra" width="200" height="80">
    <img src="{{P}}assets/images/brand/logo-400.webp" alt="" width="200" height="94">
    <img src="{{P}}assets/images/brand/betka-400.webp" alt="Betka Golob s. p." width="200" height="55">
  </div>
  <nav class="side-nav" aria-label="{{MAIN_NAV_ARIA}}">
    <a href="index.html"{{CUR_HOME}}>{{NAV_HOME}}</a>
    <a href="ponudba.html"{{CUR_PONUDBA}}>{{NAV_PONUDBA}}</a>
    <a href="kontakt.html"{{CUR_KONTAKT}}>{{NAV_KONTAKT}}</a>
  </nav>
  <div class="side-contact">
    <span class="side-place">Preserje pri Radomljah</span>
    <a href="tel:{{MOBILE_TEL}}">{{MOBILE_LABEL}}</a>
    <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
  </div>
  <nav class="side-lang" aria-label="{{LANG_ARIA}}">
{{SWITCHER}}
  </nav>
</aside>

<main class="main" id="main">
{{CONTENT}}
  <footer class="foot">
    <div class="foot-lines">
      <p>{{COPYRIGHT}}</p>
      <p class="foot-credit">{{CREDIT}}</p>
    </div>
  </footer>
</main>

{{OVERLAYS}}
<script src="{{P}}assets/js/site.js" defer></script>
</body>
</html>
