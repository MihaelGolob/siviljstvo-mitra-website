  <div class="page">
    <span class="kicker">Kontakt</span>
    <h1 class="page-title">{{OWNER}}</h1>

    <div class="contact-grid">
      <div>
        <section class="block">
          <h2 class="block-title">Naslov</h2>
          <p class="contact-addr">{{NAME}}<br>{{STREET}}<br>{{LOCALITY}}<br>{{POSTAL}}, {{COUNTRY}}</p>
        </section>
        <section class="block">
          <h2 class="block-title">Pišite ali pokličite</h2>
          <div class="contact-lines">
            <a href="tel:{{PHONE_TEL}}"><span class="contact-k">Telefon</span> {{PHONE_LABEL}}</a>
            <a href="tel:{{MOBILE_TEL}}"><span class="contact-k">GSM</span> {{MOBILE_LABEL}}</a>
            <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
          </div>
        </section>
      </div>

      <div>
        <section class="block">
          <h2 class="block-title">Kje smo</h2>
          <div class="map-card">
            <iframe src="{{MAPS_EMBED}}" title="Zemljevid — Šiviljstvo Mitra, {{STREET}}, {{LOCALITY}}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <p class="map-fallback">{{STREET}}, {{LOCALITY}} — <a href="{{MAPS_LINK}}" target="_blank" rel="noopener">Odpri v Google Zemljevidih</a></p>
        </section>
      </div>
    </div>
{{REVIEWS}}
  </div>
